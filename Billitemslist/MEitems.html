<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahaveer Events - Inventory List</title>

    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .document-container {
            background-color: #fcfbf8;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid #e0d8c3;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            background-color: #4a0000;
            color: #d4af37;
            text-align: center;
            padding: 25px 10px;
            border-bottom: 5px solid #d4af37;
        }

        .header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 36px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h2 {
            margin: 10px 0 0;
            color: #ffffff;
            font-size: 16px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* Contact Bar */
        .contact-bar {
            text-align: center;
            font-size: 13px;
            color: #333;
            padding: 15px 10px;
            border-bottom: 1px solid #d4af37;
            background-color: #fff;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            margin: 20px 0;
        }

        .section-title span {
            display: inline-block;
            border: 2px solid #4a0000;
            color: #4a0000;
            font-weight: bold;
            font-size: 20px;
            padding: 10px 20px;
            background-color: #fdfaf3;
            border-radius: 5px;
        }

        /* Inventory Table */
        .table-wrapper {
            width: 90%;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }

        th, td {
            border: 1px solid #d4af37;
            padding: 12px 15px;
            font-size: 16px;
        }

        th {
            background: linear-gradient(to bottom, #c5a059, #8b6914);
            color: #fff;
            font-weight: bold;
            text-align: left;
        }

        td {
            color: #000;
        }

        /* Quantity and Price alignment */
        th:nth-child(2),
        td:nth-child(2),
        th:nth-child(3),
        td:nth-child(3) {
            text-align: right;
        }

        /* Total Row */
        .grand-total-row td {
            background-color: #fdf4d7;
            color: #4a0000;
            font-weight: bold;
            font-size: 17px;
        }

        .grand-total-row td:last-child {
            text-align: center;
        }

        /* Input Controls */
        .controls {
            width: 90%;
            box-sizing: border-box;
            margin: 30px auto 0;
            background-color: #fff;
            padding: 15px;
            border: 1px dashed #ccc;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls input {
            box-sizing: border-box;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .controls input.cat {
            flex: 2;
            min-width: 140px;
        }

        .controls input.qty,
        .controls input.price {
            flex: 1;
            min-width: 100px;
        }

        /* Buttons */
        .btn {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            color: #fff;
        }

        .btn-add {
            background-color: #28a745;
        }

        .btn-print {
            background-color: #007bff;
        }

        .btn-delete {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* Print Settings */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm;
            }

            body {
                background-color: #fff;
                padding: 0;
                display: block;
            }

            .document-container {
                border: none;
                box-shadow: none;
                max-width: 100%;
                width: 100%;
            }

            .no-print {
                display: none !important;
            }

            .table-wrapper {
                width: 100%;
            }

            th, td {
                padding: 10px;
                font-size: 13px;
            }

            .header h1 {
                font-size: 30px;
            }

            .section-title span {
                font-size: 16px;
            }

            .grand-total-row {
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <div class="document-container">

        <!-- Header -->
        <div class="header">
            <h1>MAHAVEER EVENTS</h1>
            <h2>TENT HOUSE &amp; EVENT MANAGEMENT</h2>
        </div>

        <!-- Contact Information -->
        <div class="contact-bar">
            📍 Bagaha-01 Tiwari Tola, Bagaha, Bihar 845101
            &nbsp;|&nbsp;
            📞 +91 80025 97415
            &nbsp;|&nbsp;
            ✉️ ritesh30101991@gmail.com
        </div>

        <!-- Section Title -->
        <div class="section-title">
            <span>EVENT INVENTORY &amp; REQUIREMENTS</span>
        </div>

        <!-- Inventory Table -->
        <div class="table-wrapper">
            <table id="inventoryTable">

                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price (₹)</th>
                        <th class="no-print" style="text-align: center;">
                            Action
                        </th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                    <tr>
                        <td>Furniture</td>
                        <td class="quantity">1</td>
                        <td class="price">0.00</td>
                        <td class="no-print" style="text-align: center;">
                            <button class="btn btn-delete"
                                onclick="deleteRow(this)">X</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Furniture</td>
                        <td class="quantity">100</td>
                        <td class="price">0.00</td>
                        <td class="no-print" style="text-align: center;">
                            <button class="btn btn-delete"
                                onclick="deleteRow(this)">X</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Flowers</td>
                        <td class="quantity">1</td>
                        <td class="price">0.00</td>
                        <td class="no-print" style="text-align: center;">
                            <button class="btn btn-delete"
                                onclick="deleteRow(this)">X</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Electronics</td>
                        <td class="quantity">1</td>
                        <td class="price">0.00</td>
                        <td class="no-print" style="text-align: center;">
                            <button class="btn btn-delete"
                                onclick="deleteRow(this)">X</button>
                        </td>
                    </tr>

                </tbody>

                <!-- Total Row -->
                <tfoot>
                    <tr class="grand-total-row">
                        <td>TOTAL</td>
                        <td id="totalQuantity">103</td>
                        <td id="grandTotal">₹0.00</td>
                        <td class="no-print"></td>
                    </tr>
                </tfoot>

            </table>
        </div>

        <!-- Add Item Controls -->
        <div class="controls no-print">

            <input
                type="text"
                id="itemCat"
                class="cat"
                placeholder="Category (e.g. Furniture)"
            >

            <input
                type="number"
                id="itemQty"
                class="qty"
                placeholder="Quantity"
                min="0.01"
                step="any"
            >

            <input
                type="number"
                id="itemPrice"
                class="price"
                placeholder="Price (₹)"
                min="0"
                step="0.01"
            >

            <button class="btn btn-add" onclick="addItem()">
                + Add Item
            </button>

            <button class="btn btn-print" onclick="window.print()">
                🖨️ Print / Save PDF
            </button>

        </div>

    </div>

    <script>
        // Format currency in Indian Rupees
        function formatCurrency(amount) {
            return "₹" + amount.toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Calculate total quantity and total amount
        function calculateGrandTotal() {
            const rows = document.querySelectorAll("#tableBody tr");

            let grandTotal = 0;
            let totalQuantity = 0;

            rows.forEach(function(row) {
                const quantity = parseFloat(
                    row.querySelector(".quantity").textContent
                ) || 0;

                const price = parseFloat(
                    row.querySelector(".price").textContent
                ) || 0;

                totalQuantity += quantity;
                // grandTotal += quantity * price;
                grandTotal += price; // Assuming price is the total for that row
            });
            document.getElementById("totalQuantity").textContent =
                totalQuantity;

            document.getElementById("grandTotal").textContent =
                formatCurrency(grandTotal);
        }

        // Add a new inventory item
        function addItem() {
            const catInput = document.getElementById("itemCat");
            const qtyInput = document.getElementById("itemQty");
            const priceInput = document.getElementById("itemPrice");

            const category = catInput.value.trim() || "General";
            const quantity = parseFloat(qtyInput.value);
            const price = parseFloat(priceInput.value);

            // Validate inputs
            if (
                qtyInput.value.trim() === "" ||
                priceInput.value.trim() === ""
            ) {
                alert("Please enter Quantity and Price.");
                return;
            }

            if (!Number.isFinite(quantity) || quantity <= 0) {
                alert("Quantity must be greater than zero.");
                return;
            }

            if (!Number.isFinite(price) || price < 0) {
                alert("Price cannot be negative.");
                return;
            }

            // Create a new table row
            const table = document.getElementById("tableBody");
            const newRow = table.insertRow();

            // Category
            const categoryCell = newRow.insertCell(0);
            categoryCell.textContent = category;

            // Quantity
            const quantityCell = newRow.insertCell(1);
            quantityCell.className = "quantity";
            quantityCell.textContent = quantity;

            // Price
            const priceCell = newRow.insertCell(2);
            priceCell.className = "price";
            priceCell.textContent = price.toFixed(2);

            // Delete button
            const actionCell = newRow.insertCell(3);
            actionCell.className = "no-print";
            actionCell.style.textAlign = "center";

            const deleteButton = document.createElement("button");
            deleteButton.className = "btn btn-delete";
            deleteButton.textContent = "X";
            deleteButton.onclick = function() {
                deleteRow(this);
            };

            actionCell.appendChild(deleteButton);
            // Clear input fields
            catInput.value = "";
            qtyInput.value = "";
            priceInput.value = "";

            // Update totals
            calculateGrandTotal();
            //grand total show the sum of all the price
        }

        // Delete an item
        function deleteRow(button) {
            button.closest("tr").remove();
            calculateGrandTotal();
        }

        // Calculate totals when the page loads
        calculateGrandTotal();
    </script>

</body>
</html>
